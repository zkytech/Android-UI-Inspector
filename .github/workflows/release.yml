name: Android Release

on:
  push:
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare release metadata
        id: meta
        run: |
          build_time="$(date -u +'%Y%m%d-%H%M%S')"
          short_sha="${GITHUB_SHA::7}"
          version_name="${build_time}-${short_sha}"
          apk_name="Android-UI-Inspector-${build_time}.apk"
          release_tag="auto-${build_time}-${short_sha}"

          {
            echo "BUILD_TIME=${build_time}"
            echo "VERSION_NAME=${version_name}"
            echo "APK_NAME=${apk_name}"
            echo "RELEASE_TAG=${release_tag}"
          } >> "$GITHUB_ENV"

          {
            echo "apk_name=${apk_name}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Build Release APK
        env:
          VERSION_NAME: ${{ env.VERSION_NAME }}
        run: ./gradlew assembleRelease

      - name: Download Android public platform signing key
        run: |
          mkdir -p signing
          curl -fsSL "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/platform.pk8?format=TEXT" \
            | base64 --decode > signing/platform.pk8
          curl -fsSL "https://android.googlesource.com/platform/build/+/refs/heads/main/target/product/security/platform.x509.pem?format=TEXT" \
            | base64 --decode > signing/platform.x509.pem

      - name: Sign APK with Android public platform key
        run: |
          build_tools="$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -n 1)"
          unsigned_apk="app/build/outputs/apk/release/app-release-unsigned.apk"
          aligned_apk="app/build/outputs/apk/release/app-release-aligned.apk"
          signed_apk="app/build/outputs/apk/release/${APK_NAME}"

          if [ ! -f "$unsigned_apk" ]; then
            unsigned_apk="app/build/outputs/apk/release/app-release.apk"
          fi

          "$build_tools/zipalign" -p -f 4 "$unsigned_apk" "$aligned_apk"
          "$build_tools/apksigner" sign \
            --key signing/platform.pk8 \
            --cert signing/platform.x509.pem \
            --out "$signed_apk" \
            "$aligned_apk"
          "$build_tools/apksigner" verify --verbose "$signed_apk"

          echo "SIGNED_APK=$signed_apk" >> "$GITHUB_ENV"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk_name }}
          path: ${{ env.SIGNED_APK }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$SIGNED_APK" \
            --target "$GITHUB_SHA" \
            --title "Android UI Inspector ${BUILD_TIME}" \
            --notes "Automated build for ${GITHUB_SHA}." \
            --latest
